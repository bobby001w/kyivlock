# Публікація на GitHub Pages за офіційною інструкцією Astro:
# https://docs.astro.build/en/guides/deploy/github/
# У репозиторії: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Власний домен (див. public/CNAME): сайт у корені домену, без префікса /kyivlock/.
    env:
      SITE_URL: https://kyivlock.kyiv.ua
      BASE_PATH: /
      # Google Tag Manager; без цієї змінної тег на сайт не підключається.
      GTM_ID: GTM-TQTV3CP7
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5
      - name: Install, build, and upload your site
        uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
