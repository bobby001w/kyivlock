# Альтернатива Cloudflare Pages: власний VPS з nginx (HTTP/2 + HTTP/3, Brotli, HSTS, редиректи).
# Потрібно: nginx ≥ 1.25 з модулями brotli і perl (для нижнього регістру URL), сертифікат Let's Encrypt (certbot).
# Сайт: dist/ → /var/www/kyivlock. Українська версія — у корені, російська — /ru/ (власна 404: /ru/404.html).

perl_set $uri_lower 'sub { return lc shift->uri; }';

# 1) HTTP → HTTPS (301) для обох варіантів домену
server {
  listen 80; listen [::]:80;
  server_name kyivlock.com.ua www.kyivlock.com.ua;
  return 301 https://kyivlock.com.ua$request_uri;
}

# 2) www → без www (301)
server {
  listen 443 ssl; listen [::]:443 ssl; listen 443 quic;
  http2 on;
  server_name www.kyivlock.com.ua;
  ssl_certificate     /etc/letsencrypt/live/kyivlock.com.ua/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kyivlock.com.ua/privkey.pem;
  return 301 https://kyivlock.com.ua$request_uri;
}

# 3) Основний сайт
server {
  listen 443 ssl; listen [::]:443 ssl; listen 443 quic reuseport;
  http2 on;
  server_name kyivlock.com.ua;
  root /var/www/kyivlock;
  ssl_certificate     /etc/letsencrypt/live/kyivlock.com.ua/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kyivlock.com.ua/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Alt-Svc 'h3=":443"; ma=86400' always;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://www.google.com https://maps.google.com; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests" always;

  # Стиснення
  brotli on; brotli_comp_level 6; brotli_static on;
  brotli_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

  # Великі літери в URL → нижній регістр (301)
  if ($uri ~ [A-Z]) { return 301 $scheme://$host$uri_lower$is_args$args; }

  # /index.html → / ; шлях без слеша → зі слешем (301), крім файлів з розширенням
  rewrite ^(.*)/index\.html$ $1/ permanent;
  rewrite ^([^.]*[^/])$ $1/ permanent;

  # Видалені сторінки без заміни → 410 Gone (додавайте сюди)
  # location = /stara-storinka/ { return 410; }

  location ~* ^/(fonts|images|_astro)/ { expires 1y; add_header Cache-Control "public, immutable" always; access_log off; }
  location /js/ { expires 1d; }
  location / { try_files $uri $uri/index.html =404; }
  error_page 404 /404.html;
  location = /404.html { internal; }

  # Російська версія: своя сторінка 404
  location /ru/ { try_files $uri $uri/index.html =404; error_page 404 /ru/404.html; }
  location = /ru/404.html { internal; }

  # Сторінку подяки після форми видалено (форм на сайті немає)
  location = /dyakuiemo/ { return 301 /; }
}
